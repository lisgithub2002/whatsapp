    <div class="container">
        <!-- Header Banner -->
        <header class="app-header">
            <div class="header-content">
                <div class="state-tag">📍 Maharashtra</div>
                <h1>Car Accessories & Decor Directory</h1>
                <p>Direct WhatsApp Outreach & Follow-up Tracker</p>
            </div>
            <!-- Progress & Stats Cards -->
            <div class="kpi-cards">
                <div class="kpi-card">
                    <span class="kpi-label">Total Shops</span>
                    <strong class="kpi-val" id="totalCount">74</strong>
                </div>
                <div class="kpi-card success">
                    <span class="kpi-label">Contacted</span>
                    <strong class="kpi-val" id="completedCount">0</strong>
                </div>
                <div class="kpi-card warning">
                    <span class="kpi-label">Pending</span>
                    <strong class="kpi-val" id="pendingCount">74</strong>
                </div>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>

        <!-- Controls Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search by shop name or phone number..." autocomplete="off">
                <button id="clearSearch" class="clear-search-btn" title="Clear search" style="display: none;">✕</button>
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All (<span id="tabAllCount">74</span>)</button>
                <button class="filter-btn" data-filter="contacted">Contacted (<span id="tabContactedCount">0</span>)</button>
                <button class="filter-btn" data-filter="pending">Pending (<span id="tabPendingCount">74</span>)</button>
            </div>

            <div class="actions">
                <button id="copyContactedBtn" class="action-btn copy-btn" title="Copy contacted phone numbers">📋 Copy Done</button>
                <button id="resetBtn" class="action-btn reset-btn" title="Reset all checked status">🔄 Reset All</button>
            </div>
        </div>

        <!-- Directory Table -->
        <div class="table-wrapper">
            <table class="shop-table">
                <thead>
                    <tr>
                        <th class="th-num">#</th>
                        <th class="th-cb">
                            <input type="checkbox" id="selectAll" title="Select / Deselect all visible">
                        </th>
                        <th class="th-name">Shop Name</th>
                        <th class="th-phone">Contact Number</th>
                        <th class="th-wa">WhatsApp Chat</th>
                        <th class="th-status">Status</th>
                    </tr>
                </thead>
                <tbody id="shopTableBody">
                    <!-- Rows rendered dynamically by JS -->
                </tbody>
            </table>
            <div id="noResults" class="no-results" style="display: none;">
                <p>No matching shops found</p>
            </div>
        </div>
    </div>

        const STORAGE_KEY = 'maharashtra_whatsapp_data_v2';
        let currentFilter = 'all';
        let searchQuery = '';

        // LocalStorage Helpers
        function getSavedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                console.error('Storage error:', e);
                return {};
            }
        }

        function setSavedState(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Storage error:', e);
            }
        }

        // Show toast notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2600);
        }

        // Render Table
        function renderTable() {
            const savedState = getSavedState();
            const tbody = document.getElementById('shopTableBody');
            tbody.innerHTML = '';

            let completedCount = 0;
            const total = SHOPS_DATA.length;

            // Pre-calculate overall stats
            SHOPS_DATA.forEach(shop => {
                if (savedState[shop.id]) completedCount++;
            });

            const pendingCount = total - completedCount;

            // Update UI KPIs
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('pendingCount').textContent = pendingCount;
            document.getElementById('tabAllCount').textContent = total;
            document.getElementById('tabContactedCount').textContent = completedCount;
            document.getElementById('tabPendingCount').textContent = pendingCount;

            const progressPct = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('progressBar').style.width = progressPct + '%';

            // Filter shops
            const q = searchQuery.toLowerCase().trim();
            const filteredShops = SHOPS_DATA.filter((shop, idx) => {
                const isChecked = !!savedState[shop.id];

                // Filter tab
                if (currentFilter === 'contacted' && !isChecked) return false;
                if (currentFilter === 'pending' && isChecked) return false;

                // Search query
                if (q) {
                    const matchName = shop.name.toLowerCase().includes(q);
                    const matchPhone = shop.displayPhone.toLowerCase().includes(q);
                    if (!matchName && !matchPhone) return false;
                }
                return true;
            });

            const noResults = document.getElementById('noResults');
            if (filteredShops.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }

            let visibleCheckedCount = 0;

            filteredShops.forEach((shop, index) => {
                const isChecked = !!savedState[shop.id];
                if (isChecked) visibleCheckedCount++;

                const tr = document.createElement('tr');
                tr.setAttribute('data-id', shop.id);
                if (isChecked) tr.classList.add('completed');

                // Build WhatsApp Link
                let waButtonHtml = '<span class="disabled-link">-</span>';
                if (shop.cleanPhone && shop.cleanPhone.length >= 9) {
                    const waUrl = `https://wa.me/91${shop.cleanPhone}`;
                    waButtonHtml = `<a href="${waUrl}" target="_blank" class="whatsapp-btn" data-id="${shop.id}">
                        <svg class="wa-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                        </svg>
                        WhatsApp
                    </a>`;
                }

                // Global Shop Index Number
                const origIndex = SHOPS_DATA.findIndex(s => s.id === shop.id) + 1;

                tr.innerHTML = `
                    <td class="td-num">${origIndex}</td>
                    <td class="checkbox-cell">
                        <input type="checkbox" class="row-checkbox" data-id="${shop.id}" ${isChecked ? 'checked' : ''}>
                    </td>
                    <td class="td-name"><strong>${shop.name}</strong></td>
                    <td class="td-phone ${shop.cleanPhone ? '' : 'not-provided'}">${shop.displayPhone}</td>
                    <td class="td-wa">${waButtonHtml}</td>
                    <td class="status-cell">
                        <span class="status-badge ${isChecked ? 'contacted' : 'pending'}">
                            ${isChecked ? 'Contacted ✔' : 'Pending'}
                        </span>
                    </td>
                `;

                tbody.appendChild(tr);
            });

            // Update Select All Checkbox state
            const selectAllCb = document.getElementById('selectAll');
            if (selectAllCb) {
                const totalVisible = filteredShops.length;
                selectAllCb.checked = totalVisible > 0 && visibleCheckedCount === totalVisible;
                selectAllCb.indeterminate = visibleCheckedCount > 0 && visibleCheckedCount < totalVisible;
            }

            attachRowListeners();
        }

        // Attach Event Listeners to rendered elements
        function attachRowListeners() {
            // Checkbox toggle
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.addEventListener('change', function() {
                    const id = this.getAttribute('data-id');
                    const savedState = getSavedState();
                    savedState[id] = this.checked;
                    setSavedState(savedState);
                    renderTable();
                });
            });

            // WhatsApp button click -> Auto check & persist
            document.querySelectorAll('.whatsapp-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const savedState = getSavedState();
                    savedState[id] = true;
                    setSavedState(savedState);
                    // Re-render after a tiny timeout to not block window open
                    setTimeout(renderTable, 50);
                });
            });
        }

        // Setup Header & Toolbar Events
        function setupControls() {
            // Search Input
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearch');

            searchInput.addEventListener('input', function(e) {
                searchQuery = e.target.value;
                clearSearchBtn.style.display = searchQuery ? 'block' : 'none';
                renderTable();
            });

            clearSearchBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.style.display = 'none';
                renderTable();
            });

            // Filter Tabs
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-filter');
                    renderTable();
                });
            });

            // Select All Checkbox
            const selectAllCb = document.getElementById('selectAll');
            selectAllCb.addEventListener('change', function() {
                const isChecked = this.checked;
                const savedState = getSavedState();

                // Apply to currently visible rows
                document.querySelectorAll('.row-checkbox').forEach(cb => {
                    const id = cb.getAttribute('data-id');
                    savedState[id] = isChecked;
                });

                setSavedState(savedState);
                renderTable();
            });

            // Reset All Button
            document.getElementById('resetBtn').addEventListener('click', function() {
                if (confirm('Are you sure you want to reset all checked progress?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    showToast('All progress reset successfully');
                    renderTable();
                }
            });

            // Copy Contacted Numbers
            document.getElementById('copyContactedBtn').addEventListener('click', function() {
                const savedState = getSavedState();
                const contactedNumbers = SHOPS_DATA
                    .filter(s => savedState[s.id] && s.cleanPhone)
                    .map(s => `${s.name}: ${s.displayPhone}`);

                if (contactedNumbers.length === 0) {
                    showToast('No contacted shops yet');
                    return;
                }

                navigator.clipboard.writeText(contactedNumbers.join('\n'))
                    .then(() => showToast(`Copied ${contactedNumbers.length} contacted shops to clipboard!`))
                    .catch(() => showToast('Failed to copy to clipboard'));
            });
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            setupControls();
            renderTable();
        });
    </script>
</body>
</html>
